# Muse lean+fast: minimal effort, connectors stripped (MCP/apps/plugins
# except native computer-use). Agents, multi-agent, search, skills stay on.
model = "muse-spark-1.3"
model_provider = "muse"
model_catalog_json = "__CODEX_HOME__/model-catalogs/muse-models.json"
model_reasoning_effort = "minimal"

[apps._default]
enabled = false
[apps.connector_5f3c8c41a1e54ad7a76272c89e2554fa]
enabled = false
[apps.connector_947e0d954944416db111db556030eea6]
enabled = false

[mcp_servers.context7]
enabled = false
[mcp_servers.pencil]
enabled = false
[mcp_servers.playwright]
enabled = false
[mcp_servers.node_repl]
enabled = false
[mcp_servers.notion]
enabled = false
[mcp_servers.openaiDeveloperDocs]
enabled = false
[mcp_servers.morrow]
enabled = false
[mcp_servers.cua-driver]
enabled = false
[mcp_servers.cua]
enabled = false
[plugins."tunnel-mcp@debug"]
enabled = false
[plugins."computer-use@openai-bundled"]
enabled = false
[plugins."unified-computer-use@openai-bundled"]
enabled = false
[plugins."google-calendar@openai-curated"]
enabled = false
